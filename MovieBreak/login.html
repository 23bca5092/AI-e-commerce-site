<!DOCTYPE HTML>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width">
        <meta name="description" content="this is an online movie browing website">
        <meta name="author" content="P Thrinesh Rao">
        <title>MOVIE BREAK | SignUP/Login</title>
        <link rel="icon" href="./img/titleicon2.png" type="img/icon">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
        <style>
            body#login{
                font-family: Arial, Helvetica, sans-serif;
                background: url("img/loginimag.jpg");
                background-repeat: no-repeat;
                background-size: cover;
            }
            *{

            }
            .branding{
                top: 0;
                float: left;
                z-index: 2;
            }
            form{
                left: 50%;
                top: 50%;
                position: absolute;
                transform: translate(-50%,-50%);
                padding: 10px 10px 80px 10px;
                text-align: center;!important
                border-radius: 20px;
                width: 350px;
                z-index: 2;
            }
            img{
                width: 130px;
                height: 130px;
                border: 5px solid #fff;
                border-radius: 50%;
                margin-top: 80px;
                margin-bottom: 20px;
                background:red;
                z-index: 2;
                
            }
            .input-container{
                display: flex;
                width: 100%;
                margin-bottom: 15px;
                z-index: 2;
                
            }
            .icon{
                padding: 10px;
                background:red;
                color: #fff;
                min-width: 50px;
                text-align: center;!important
                z-index: 2;
                
            }
            .input-field{
                width: 100%;
                padding: 10px;
                outline: none;
                font-size: 15px;
                z-index: 2;
                
            }
            .input-field:focus{
                border: 2px solid red;
            }
            .btn{
                background:red;
                color: #fff;
                padding: 15px 20px;
                border: none;
                cursor: pointer;
                width: 100%;
                font-size: 18px;
                z-index: 2;
                
            }
            .btn:hover{
            background: orange;
            z-index: 2;

            }
            .btn#signup{
                background:red;
                color: #fff;
                padding: 15px 20px;
                border: none;
                cursor: pointer;
                width: 100%;
                font-size: 18px;
                margin-top: 10px;
                z-index: 2;

            }
            .btn#signup:hover{
                background: orange;
                z-index: 2;
            }
            body::after{
                content: "";
                position:absolute;
                top: 0;
                left: 0;
                bottom: 0;
                width: 100%;
                height: 100%;
                z-index: 1;
                background: rgba(0, 0, 0, 0.6);
            }
        </style>
    </head>
    <body id="login">
        <form>
            <img onclick="document.location='./index.html'" width="100px" src="./img/clienticon4.png" alt="this is a login client image">
            <div class="input-container">
                <i class="fa fa-user icon"></i>
                <input class="input-field" type="text" placeholder="Username">
            </div>
            <div class="input-container">
                <i class="fa fa-envelope icon"></i>
                <input class="input-field" type="text" placeholder="Email">
            </div>
            <div class="input-container">
                <i class="fa fa-key icon"></i>
                <input class="input-field" type="password" placeholder="Password">
            </div>
            <button onclick="document.location='./movie web page/index.html'" type="button" class="btn" id="signup">Login</button>
            <button type="submit" class="btn" id="signup">Forget password?</button>
            
        </form>
    </body>
</html>
